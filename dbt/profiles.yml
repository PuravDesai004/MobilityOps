# Local-only, contains no credentials. The optional Snowflake example is a separate file.
mobilityops:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('MOBILITYOPS_DB_PATH', '../data/db/fixture.duckdb') }}"
      schema: analytics
      threads: 2
      settings:
        memory_limit: 1GB
        preserve_insertion_order: false
